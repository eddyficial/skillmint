[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillmint"
version = "0.1.0"
description = "Compile videos, documents, and SOPs into source-backed, certified agent skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Eddy" }
]
keywords = [
  "mcp",
  "claude",
  "claude-code",
  "youtube",
  "tutorial",
  "playbook",
  "skill-synthesis",
  "llm-agent",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.0.0",
  "yt-dlp>=2024.0",
  "pdfplumber>=0.11",
  "httpx>=0.27",
  "lxml>=5.0",
]

[project.urls]
Homepage = "https://github.com/eddyficial/skillmint"
Repository = "https://github.com/eddyficial/skillmint"
Issues = "https://github.com/eddyficial/skillmint/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pillow>=10.0",
]
video-transcription = [
  "faster-whisper>=1.0",
  "numpy>=1.24",
]
rendered-web = [
  "playwright>=1.45",
]
ocr = [
  "pytesseract>=0.3",
]

[project.scripts]
skillmint = "skillmint.server:main"
skillmint-create = "skillmint.automation:main"
skillmint-ui = "skillmint.web_ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
